[package]
name = "icsdrone-rs"
version = "2.2.9"
edition = "2024"
description = "An ICS <-> UCI chess engine bridge"
license = "AGPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "io-std", "time", "sync", "fs"] }
clap = { version = "=4.4.18", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: saving gui_options rewrites config.json in its own key order.
serde_json = { version = "1", features = ["preserve_order"] }
polyglot-book-rs = "0.1.0"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["svg", "image"] }
# The JPEG/PNG decoders for the picture boards (egui_extras's "image"
# loader turns no formats on by itself).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
shakmaty = "0.30.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
socket2 = { version = "0.6", features = ["all"] }

[profile.release]
opt-level = 3
# Thin LTO: nearly all of full LTO's gain, in a fraction of the build
# time, spread across cores.
lto = "thin"

# Optimized but no LTO, for quick test builds:
# cargo build --profile quick  ->  target/quick/icsdrone-rs
[profile.quick]
inherits = "release"
lto = false
incremental = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation"] }


